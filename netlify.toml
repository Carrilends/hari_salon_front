[build]
  command = "yarn build:ssg"
  publish = "dist/ssg"

[build.environment]
  NODE_VERSION = "20"

# La API se sirve bajo el propio dominio del sitio para que la cookie de sesion
# sea de primera parte (Fase 3b, decision estructural S5). DEBE ir ANTES del
# catch-all: Netlify aplica la primera regla que casa. Ojo: Netlify procesa un
# public/_redirects ANTES que este archivo, asi que no debe existir uno con un
# catch-all: ensombrecia esta regla y /api/* devolvia el index.html (2026-11-17).
# Destino: la API en Railway (desplegada el 2026-11-17, docs/despliegue/registro.md).
[[redirects]]
  from = "/api/*"
  to = "https://hairsalonback-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Respaldo SPA: las rutas sin HTML prerenderizado (ej: /mi-cuenta) caen al index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
